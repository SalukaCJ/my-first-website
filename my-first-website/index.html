
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile</title>

    <style>
        /* Page design */
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf0ff;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Profile card */
        .profile {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Profile avatar */
        .avatar {
            width: 100px;
            height: 100px;
            background-color: #e4e9ff;
            color: #4f5fc7;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        /* Name */
        h1 {
            color: #24304a;
            font-size: 28px;
        }

        /* Bio */
        p {
            color: #657089;
            font-size: 16px;
            line-height: 1.6;
        }

        /* Contact button */
        .contact-btn {
            display: inline-block;
            background-color: #4f5fc7;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 16px;
        }

        /* Button hover effect */
        .contact-btn:hover {
            background-color: #3545a5;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="avatar">SS</div>

        <h1>Saluka Samarakoon</h1>

        <p>
            Hello! I'm a curious learner who enjoys
            exploring technology, programming,
            and new ideas. Welcome to my
            personal website!
        </p>

        <a href="mailto:your.email@example.com"
           class="contact-btn">
            Contact Me
        </a>

    </div>

</body>
</html>
